<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Selector de métricas Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab instrument panel — status bar + equipment rail on top, metric list as the working surface, details unfold inline. */
:root{
  --bg:#F3F4EE; --surface:#FFFFFF; --ink:#16180F; --muted:#5E6355; --line:#DDE0D3; --soft:#ECEEE4;
  --accent:#B9C800; --accent-ink:#16180F; --accent-soft:#EEF3B8;
  --yes:#1F7A3A; --yes-soft:#DCF0E0; --no:#8A8F80; --no-soft:#EDEEE8; --pend:#9A6A00; --pend-soft:#FBEFD2;
  --principal:#16180F; --focus:#4B6BFF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111309; --surface:#1A1D12; --ink:#ECEFDF; --muted:#A3A893; --line:#2D3122; --soft:#22261A;
  --accent:#D7E80B; --accent-ink:#111309; --accent-soft:#33380F;
  --yes:#5FD07E; --yes-soft:#173322; --no:#8D927F; --no-soft:#25281D; --pend:#F0B640; --pend-soft:#3A2E10;
  --principal:#ECEFDF; --focus:#8FA4FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111309; --surface:#1A1D12; --ink:#ECEFDF; --muted:#A3A893; --line:#2D3122; --soft:#22261A;
  --accent:#D7E80B; --accent-ink:#111309; --accent-soft:#33380F;
  --yes:#5FD07E; --yes-soft:#173322; --no:#8D927F; --no-soft:#25281D; --pend:#F0B640; --pend-soft:#3A2E10;
  --principal:#ECEFDF; --focus:#8FA4FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,40px);letter-spacing:.01em;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{min-width:84px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat.yes b{color:var(--yes)} .stat.no b{color:var(--no)} .stat.pend b{color:var(--pend)}
.rail{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:thin}
.eq{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 12px 9px;cursor:pointer;text-align:left;font:inherit;min-width:130px}
.eq .n{font-weight:600;font-size:14px;display:block;white-space:nowrap}
.eq .p{font-family:var(--mono);font-size:11px;color:var(--muted)}
.eq .bar{height:4px;background:var(--soft);border-radius:2px;margin-top:6px;overflow:hidden;display:flex}
.eq .bar i{display:block;height:100%}
.eq[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eq[aria-pressed="true"] .p{color:var(--bg);opacity:.75}
.eq[aria-pressed="true"] .bar{background:rgba(127,127,127,.35)}
.note{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:13.5px;color:var(--ink)}
.note small{display:block;color:var(--muted);margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 10px}
.tools input[type=search],.tools select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0}
.tools input[type=search]{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:8px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.count{font-size:13px;color:var(--muted);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.m{border-top:1px solid var(--line)}
.m:first-child{border-top:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:11px 14px}
.head{display:flex;gap:10px;align-items:flex-start;min-width:0;cursor:pointer;background:none;border:0;font:inherit;color:inherit;text-align:left;padding:0}
.caret{flex:0 0 auto;width:18px;height:18px;margin-top:2px;border-radius:4px;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.m.open .caret{transform:rotate(90deg)}
.names{min-width:0}
.es{font-weight:500}
.m.principal .es{font-weight:600}
.m.tecnico .es{color:var(--muted)}
.en{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11px;line-height:1;padding:4px 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.tipo-Principal{background:var(--ink);color:var(--bg)}
.tag.unit{font-family:var(--mono)}
.tag.def{background:var(--accent-soft);color:var(--ink)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pick{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pick button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:6px 10px;cursor:pointer;min-width:42px}
.pick button+button{border-left:1px solid var(--line)}
.pick button[data-v="si"][aria-pressed="true"]{background:var(--yes-soft);color:var(--yes)}
.pick button[data-v="no"][aria-pressed="true"]{background:var(--no-soft);color:var(--ink)}
.pick button[data-v="pendiente"][aria-pressed="true"]{background:var(--pend-soft);color:var(--pend)}
.prio{font:inherit;font-size:12.5px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.m.st-si{box-shadow:inset 4px 0 0 var(--yes)}
.m.st-no .es{text-decoration:line-through;text-decoration-color:var(--no)}
.det{display:none;padding:2px 14px 16px 42px;gap:14px 28px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.m.open .det{display:grid}
.det h4{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.det p{margin:0}
.det ul{margin:0;padding-left:18px}
.det .full{grid-column:1/-1}
.vars{display:flex;flex-direction:column;gap:3px;font-size:13px}
.vars div{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:10px}
.vars code{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
textarea{font:inherit;font-size:14px;width:100%;min-height:58px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
.who{font-size:12px;color:var(--muted);margin-top:4px}
.test{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px;overflow:hidden}
.test>button{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;font:inherit;border:0;background:var(--surface);color:var(--ink);padding:12px 14px;cursor:pointer;text-align:left}
.test>button .t{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.01em;line-height:1.1}
.test>button .g{font-size:12px;color:var(--muted)}
.test>button .r{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.bat{font-family:var(--body);font-size:11px;font-weight:600;padding:3px 7px;border-radius:4px;background:var(--accent);color:var(--accent-ink)}
.test .list{border:0;border-top:1px solid var(--line);border-radius:0}
.grp{font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.banner{margin-top:12px;padding:9px 12px;border-radius:6px;background:var(--pend-soft);color:var(--ink);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13.5px;z-index:9}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.more{display:block;margin:10px auto 0}
.tag.dep{background:var(--accent-soft);color:var(--ink);font-weight:600}
.deps{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 12px;font-size:13px;align-items:baseline}
.deps .s{font-weight:600}
.deps .fut{color:var(--muted);font-weight:500}
.deps .lv{font-size:11px;font-family:var(--mono);color:var(--muted)}
.deps .lv.k{color:var(--ink);font-weight:600}
.deps .sep{grid-column:1/-1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
@media (max-width:640px){
  .row{grid-template-columns:1fr}
  .ctrl{justify-content:flex-start;padding-left:28px}
  .det{padding-left:14px}
  .vars div{grid-template-columns:1fr;gap:0}
}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}
</style>

</div>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const EQ = DATA.equipos, VT = DATA.variantes, DEP = DATA.deportes || [];
const DEPN = {}; DEP.forEach(d => DEPN[d[0]] = d);
const byEq = {}; EQ.forEach(e => { byEq[e.id] = e; e.idx = {}; e.metricas.forEach(m => e.idx[m.id] = m); });
const LS = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const st = { eq: LS('eq') && byEq[LS('eq')] ? LS('eq') : 'forcedecks', view: 'metrica', q: '', tipo: '', estado: '', dep: '', open: new Set(), openTests: new Set(['Countermovement-Jump-Variations','ss-30yd-Sprint']), limit: 60 };
let SEL = {}; let db = null, user = null, canWrite = null, downloads = null; const names = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key = (e, m) => e + '__' + m;
const sel = (e, m) => SEL[key(e, m)] || {};
const estado = (e, m) => sel(e, m).estado || 'pendiente';
const tipoClass = t => ({Principal:'principal',Detalle:'detalle',Relación:'relacion',Técnico:'tecnico'})[t] || '';
function toast(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }

function counts(e){ let y=0,n=0; e.metricas.forEach(m => { const s = estado(e.id, m.id); if (s==='si') y++; else if (s==='no') n++; }); return {t:e.metricas.length,y,n,p:e.metricas.length-y-n}; }
function renderStats(){
  let t=0,y=0,n=0; EQ.forEach(e => { const c = counts(e); t+=c.t; y+=c.y; n+=c.n; });
  $('sTot').textContent = t; $('sYes').textContent = y; $('sNo').textContent = n; $('sPend').textContent = t-y-n;
  $('rail').innerHTML = EQ.map(e => { const c = counts(e); const pc = x => (100*x/c.t).toFixed(1)+'%';
    return `<button type="button" class="eq" data-eq="${e.id}" aria-pressed="${e.id===st.eq}"><span class="n">${esc(e.nombre)}</span><span class="p">${c.y+c.n}/${c.t} decididas · ${c.y} sí</span><span class="bar"><i style="width:${pc(c.y)};background:var(--yes)"></i><i style="width:${pc(c.n)};background:var(--no)"></i></span></button>`; }).join('');
}
function match(e, m){
  if (st.tipo && (m.tipo||'Principal') !== st.tipo) return false;
  if (st.estado && estado(e.id, m.id) !== st.estado) return false;
  if (st.dep && !(m.dep||[]).some(d => d[0] === st.dep)) return false;
  if (st.q){ const q = st.q.toLowerCase(); if (!((m.es||'')+' '+(m.en||'')+' '+(m.que||'')).toLowerCase().includes(q)) return false; }
  return true;
}
function tagsHtml(m){
  const t = [];
  if (m.tipo) t.push(`<span class="tag tipo-${esc(m.tipo)}">${esc(m.tipo)}</span>`);
  if (m.u && m.u !== '—') t.push(`<span class="tag unit">${esc(m.u)}</span>`);
  if (m.defecto) t.push(`<span class="tag def">Se ve por defecto en el Hub</span>`);
  (m.subs||[]).forEach(s => t.push(`<span class="tag">${esc(s)}</span>`));
  const kl = (m.dep||[]).filter(d => d[1] === 'Clave' && DEPN[d[0]] && DEPN[d[0]][2] === 'Activo').map(d => DEPN[d[0]][1]);
  if (kl.length) t.push(`<span class="tag dep">Clave en ${esc(kl.join(', '))}</span>`);
  if (m.pruebas) t.push(`<span class="tag">En ${m.pruebas.length} prueba${m.pruebas.length>1?'s':''}</span>`);
  else if (m.pr) t.push(`<span class="tag">${esc(m.pr.length>60? m.pr.slice(0,57)+'…' : m.pr)}</span>`);
  return t.join('');
}
function rowHtml(e, m, ctx){
  const s = sel(e.id, m.id), es = estado(e.id, m.id), oid = (ctx ? ctx.pre : '') + m.id, open = st.open.has(oid);
  const dis = canWrite === false ? 'disabled' : '';
  const pick = ['si','no','pendiente'].map(v => `<button type="button" data-v="${v}" aria-pressed="${es===v}" title="${v==='si'?'Se usa':v==='no'?'No se usa':'Por decidir'}" ${dis}>${v==='si'?'Sí':v==='no'?'No':'?'}</button>`).join('');
  const prio = `<select class="prio" aria-label="Prioridad" ${dis}><option value="">Prioridad</option>${['Alta','Media','Baja'].map(p => `<option ${s.prioridad===p?'selected':''}>${p}</option>`).join('')}</select>`;
  let det = '';
  if (open){
    const parts = [];
    parts.push(`<div><h4>Qué es</h4><p>${esc(m.que||'—')}</p></div>`);
    parts.push(`<div><h4>Para qué sirve</h4><p>${esc(m.uso||'—')}</p></div>`);
    if (m.subs && m.subs.length) parts.push(`<div><h4>Submétricas</h4><ul>${m.subs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`);
    const dl = (m.dep||[]), act = dl.filter(d => DEPN[d[0]][2] === 'Activo'), fut = dl.filter(d => DEPN[d[0]][2] !== 'Activo');
    const drow = (d, f) => `<span class="s ${f?'fut':''}">${esc(DEPN[d[0]][1])}</span><span class="lv ${d[1]==='Clave'?'k':''}">${esc(d[1])}</span><span>${esc(d[2])}</span>`;
    if (dl.length) parts.push(`<div class="full"><h4>Para qué sirve en cada deporte</h4><div class="deps">${act.length?'<span class="sep">Deportes activos</span>'+act.map(d=>drow(d)).join(''):''}${fut.length?'<span class="sep">A futuro</span>'+fut.map(d=>drow(d,1)).join(''):''}</div></div>`);
    else parts.push(`<div class="full"><h4>Para qué sirve en cada deporte</h4><p>Dato técnico o de control: no depende del deporte.</p></div>`);
    if (m.pruebas) parts.push(`<div><h4>Aparece en</h4><p>${esc(m.pruebas.join(', '))}</p></div>`);
    else if (m.pr) parts.push(`<div><h4>Prueba o medición</h4><p>${esc(m.pr)}</p></div>`);
    if (m.donde) parts.push(`<div><h4>Dónde sale el dato</h4><p>${esc(m.donde)}</p></div>`);
    if (ctx && ctx.vars) parts.push(`<div class="full"><h4>Valores de esta métrica en esta prueba</h4><div class="vars">${ctx.vars.map(v=>`<div><span>${esc(VT[v[0]])}</span><code>${esc(v[1])}</code></div>`).join('')}</div></div>`);
    let who = '';
    if (s.por){ const nm = names[s.por] || 'Alguien del equipo'; who = `<div class="who">Última decisión: ${esc(nm)}${s.en?' · '+esc(new Date(s.en).toLocaleDateString('es-EC',{day:'numeric',month:'short'})):''}</div>`; }
    parts.push(`<div class="full"><h4>Comentario (Capi, Fabi, VALD)</h4><textarea id="n-${esc(oid)}" data-note placeholder="Por qué se usa o no, en qué prueba, dudas para VALD…" ${dis}>${esc(s.nota||'')}</textarea>${who}</div>`);
    det = `<div class="det">${parts.join('')}</div>`;
  }
  return `<div class="m ${tipoClass(m.tipo)} st-${es} ${open?'open':''}" data-eq="${e.id}" data-m="${m.id}" data-oid="${esc(oid)}">
    <div class="row">
      <button type="button" class="head" aria-expanded="${open}"><span class="caret" aria-hidden="true">▸</span><span class="names"><span class="es">${esc(m.es)}</span><br><span class="en">${esc(m.en)}</span><span class="tags">${tagsHtml(m)}</span></span></button>
      <div class="ctrl"><span class="pick" role="group" aria-label="¿Se usa?">${pick}</span>${prio}</div>
    </div>${det}</div>`;
}
function render(){
  renderStats();
  const e = byEq[st.eq];
  $('note').innerHTML = `${esc(e.nota)}<small>Fuente: ${esc(e.fuente)}</small>`;
  $('note').hidden = !e.nota && !e.fuente;
  const hasTests = !!e.pruebas;
  $('view').hidden = !hasTests; $('fTipo').hidden = !['forcedecks','smartspeed'].includes(st.eq);
  if (!hasTests) st.view = 'metrica';
  [...$('view').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.v === st.view));
  const out = $('out');
  if (st.view === 'metrica'){
    const ms = e.metricas.filter(m => match(e, m));
    $('count').textContent = `${ms.length} de ${e.metricas.length} métricas`;
    if (!ms.length){ out.innerHTML = `<div class="empty">Ninguna métrica coincide con la búsqueda o los filtros.</div>`; return; }
    const shown = ms.slice(0, st.limit);
    out.innerHTML = `<div class="list">${shown.map(m => rowHtml(e, m)).join('')}</div>` + (ms.length > st.limit ? `<button type="button" class="btn ghost more" id="more">Mostrar ${Math.min(60, ms.length - st.limit)} más (quedan ${ms.length - st.limit})</button>` : '');
  } else {
    let html = '', lastG = '', nTests = 0;
    e.pruebas.forEach(p => {
      const items = p.items.filter(([mid]) => match(e, e.idx[mid]));
      if (!items.length) return; nTests++;
      if (p.grupo !== lastG){ html += `<h3 class="grp">Pruebas de ${esc(p.grupo.toLowerCase())}</h3>`; lastG = p.grupo; }
      const open = st.openTests.has(p.id) || !!st.q;
      const yes = items.filter(([mid]) => estado(e.id, mid)==='si').length;
      html += `<section class="test"><button type="button" data-test="${p.id}" aria-expanded="${open}"><span><span class="t">${esc(p.es)}</span><br><span class="g">${esc(p.en)}</span></span><span class="r">${p.bateria?'<span class="bat">Batería fútbol</span>':''}<span>${items.length} métricas · ${yes} sí</span><span aria-hidden="true">${open?'▾':'▸'}</span></span></button>`;
      if (open) html += `<div class="list">${items.map(([mid, vars]) => rowHtml(e, e.idx[mid], {pre: p.id+'--', vars})).join('')}</div>`;
      html += `</section>`;
    });
    $('count').textContent = `${nTests} pruebas · abre una para ver sus métricas y submétricas`;
    out.innerHTML = html || `<div class="empty">Ninguna prueba tiene métricas que coincidan con los filtros.</div>`;
  }
}
async function save(eid, mid, patch){
  if (!db){ toast('No se pudo guardar: abre la página desde Claude con tu cuenta.'); return; }
  const k = key(eid, mid), prev = SEL[k] || {};
  const body = Object.assign({estado:'pendiente', prioridad:'', nota:''}, prev, patch, {equipo:eid, metrica:mid, en:new Date().toISOString()});
  if (user){ try { const id = await user.id(); if (id) body.por = id; } catch(e){} }
  SEL[k] = body; render();
  try { await db.doc('seleccion/' + k).set(body); }
  catch (err){
    SEL[k] = prev; render();
    if (err && err.code === 'invalid_argument'){ canWrite = false; showRO(); }
    else toast('No se pudo guardar. Intenta de nuevo.');
  }
}
function showRO(){ const b = $('banner'); b.hidden = false; b.textContent = 'Solo lectura: tu acceso a esta página no permite marcar métricas. Pide a Kimberly acceso como Colaborador.'; render(); }

document.addEventListener('click', ev => {
  const t = ev.target;
  const eqb = t.closest('.eq'); if (eqb){ st.eq = eqb.dataset.eq; LS('eq', st.eq); st.limit = 60; render(); return; }
  const vb = t.closest('#view button'); if (vb){ st.view = vb.dataset.v; render(); return; }
  if (t.closest('#more')){ st.limit += 60; render(); return; }
  const tb = t.closest('.test>button'); if (tb){ const id = tb.dataset.test; st.openTests.has(id) ? st.openTests.delete(id) : st.openTests.add(id); render(); return; }
  const m = t.closest('.m'); if (!m) return;
  const pb = t.closest('.pick button'); if (pb){ save(m.dataset.eq, m.dataset.m, {estado: pb.dataset.v}); return; }
  if (t.closest('.head')){ const o = m.dataset.oid; st.open.has(o) ? st.open.delete(o) : st.open.add(o); render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target, m = t.closest('.m');
  if (m && t.classList.contains('prio')) save(m.dataset.eq, m.dataset.m, {prioridad: t.value});
  if (m && t.hasAttribute('data-note')){ const v = t.value.trim(); if (v !== (sel(m.dataset.eq, m.dataset.m).nota||'')) save(m.dataset.eq, m.dataset.m, {nota: v}); }
});
$('q').addEventListener('input', ev => { st.q = ev.target.value.trim(); st.limit = 60; clearTimeout(render.t); render.t = setTimeout(render, 150); });
$('fTipo').addEventListener('change', ev => { st.tipo = ev.target.value; st.limit = 60; render(); });
$('fDep').innerHTML += DEP.map(d => `<option value="${d[0]}">${esc(d[1])}${d[2]==='Activo'?'':' (a futuro)'}</option>`).join('');
$('fDep').addEventListener('change', ev => { st.dep = ev.target.value; st.limit = 60; render(); });
$('fEstado').addEventListener('change', ev => { st.estado = ev.target.value; st.limit = 60; render(); });
$('dl').addEventListener('click', async () => {
  const lab = {si:'Sí', no:'No', pendiente:'Por decidir'};
  const rows = [['Equipo','Métrica (español)','Métrica en el equipo','Unidad','Tipo','¿Se usa?','Prioridad','Comentario','Qué es','Para qué sirve', ...DEP.map(d => d[1] + (d[2]==='Activo'?'':' (futuro)'))]];
  EQ.forEach(e => e.metricas.forEach(m => { const s = sel(e.id, m.id); rows.push([e.nombre, m.es, m.en, m.u, m.tipo||'', lab[estado(e.id,m.id)], s.prioridad||'', s.nota||'', m.que||'', m.uso||'', ...DEP.map(d => { const x = (m.dep||[]).find(y => y[0]===d[0]); return x ? x[1] + ': ' + x[2] : ''; })]); }));
  const csv = '﻿' + rows.map(r => r.map(x => '"' + String(x).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  if (!downloads){ toast('La descarga no está disponible en esta vista.'); return; }
  try { const r = await downloads.save({filename:'seleccion_metricas_lab.csv', data: csv}); if (r && r.status === 'saved') toast('Descargado'); }
  catch (e){ if (e && e.code !== 'cancelled') toast('No se pudo descargar.'); }
});

render();

(async () => {
  const [d, u, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
  db = d; user = u; downloads = dl;
  if (!dl) $('dl').hidden = true;
  if (u){ try { canWrite = await u.can('data.write'); } catch(e){} if (canWrite === false) showRO(); }
  if (!db){ const b = $('banner'); b.hidden = false; b.textContent = 'Estás viendo la lista sin las decisiones del equipo. Ábrela desde Claude con tu cuenta para ver y marcar métricas.'; return; }
  db.collection('seleccion').onSnapshot(async snap => {
    const next = {}; snap.docs.forEach(doc => { next[doc.id] = doc.data(); }); SEL = next;
    if (user){ const ids = [...new Set(Object.values(SEL).map(s => s.por).filter(Boolean))].filter(id => !(id in names));
      if (ids.length){ try { const ps = await user.profiles(ids); ids.forEach(id => names[id] = (ps && ps[id] && ps[id].name) || ''); } catch(e){} } }
    const a = document.activeElement; const keep = a && a.tagName === 'TEXTAREA' ? {id:a.id, v:a.value, s:a.selectionStart} : null;
    render();
    if (keep){ const el = document.getElementById(keep.id); if (el){ el.value = keep.v; el.focus(); try{ el.setSelectionRange(keep.s, keep.s);}catch(e){} } }
  }, err => { const b = $('banner'); b.hidden = false; b.textContent = 'Se perdió la conexión con las decisiones guardadas. Recarga la página.'; });
})();
})();
